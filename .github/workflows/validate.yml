name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.15.2"
      - name: Validate the corpus
        run: uv run validate.py
      - name: Check INDEX.md is up to date
        run: |
          uv run validate.py --write-index
          git diff --exit-code prayer/INDEX.md
