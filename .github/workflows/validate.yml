name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.10"
          python-version: "3.15.2"
      - name: Validate the corpus
        run: uv run validate.py
      - name: Check INDEX.md is up to date
        run: |
          uv run validate.py --write-index
          git diff --exit-code prayer/INDEX.md
