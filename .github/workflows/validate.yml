name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate the corpus
        run: uv run validate.py
      - name: Check INDEX.md is up to date
        run: |
          uv run validate.py --write-index
          git diff --exit-code prayer/INDEX.md
